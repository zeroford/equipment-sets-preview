
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipment Sets</title>
  <style>
    :root {
      --bg: #0f1114;
      --card: #2a2e33;
      --text: #f1f3f5;
      --muted: #868e96;
      --divider: rgba(255, 255, 255, 0.08);
      /* tab bar ล่าง = ตัวเลือกหลัก, toggle/ปุ่ม Save = ระดับรอง */
      --tab-active: rgba(255, 255, 255, 0.86);
      --tab-active-text: #18181b;
      --pill-active: #3f3f46;
      --card-max: 175px;
      --card-gap: 1rem;
      --dock-bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
      --dock-scroll-pad: calc(4.35rem + env(safe-area-inset-bottom, 0px));
    }

    .glass-chip {
      /*
       * NOTE: พื้นต้องสว่างกว่า --bg พอสมควร ไม่งั้นปุ่มลอยกลืนไปกับพื้นหลัง
       * ใช้ zinc-800 ชุดเดียวกับ .best-tag ให้ผิวลอยทั้งหน้าเป็นโทนเดียวกัน
       */
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(39, 39, 42, 0.85);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem var(--dock-scroll-pad);
    }

    .page { max-width: 1200px; margin: 0 auto; }

    /* จอกว้าง: วาง row-group เป็น 2 คอลัมน์ ได้การ์ด 3 3 / 3 3 แทนที่จะเรียงลงยาว 4 แถว */
    @media (min-width: 1080px) {
      .page {
        max-width: none;
      }
      .section {
        display: grid;
        /*
         * กว้างสุดเท่าการ์ด 3 ใบ ไม่ใช้ 1fr — ไม่งั้นแถบ tag ด้านบนจะยืดเกินแนวการ์ด
         * NOTE: ต้องเป็น minmax(0, …) ไม่ใช่ค่าตายตัว — ช่วงจอ 1080–1245px
         * สองคอลัมน์รวมกันกว้างกว่าจอ ถ้าหดไม่ได้จะล้นออกนอกจอทั้งซ้ายและขวา
         */
        grid-template-columns: repeat(2, minmax(0, calc(var(--card-max) * 3 + var(--card-gap) * 2)));
        /* แถวหัวข้อ + แถวการ์ดอีก 2 */
        grid-template-rows: auto auto auto;
        /*
         * ไล่ลงก่อนแล้วค่อยข้ามคอลัมน์ ให้ slot เรียง
         *   1 2 3 | 7 8 9
         *   4 5 6 | 10 11 12
         * ถ้าใช้ flow แบบแถว จะได้ 1-3 | 4-6 / 7-9 | 10-12 ซึ่งอ่านข้ามไปมา
         */
        grid-auto-flow: column;
        justify-content: center;
        column-gap: 1.5rem;
        align-items: start;
      }
      .section-header {
        grid-column: 1 / -1;
        grid-row: 1;
      }
    }

    .section[hidden] {
      display: none !important;
    }

    .set-tabs {
      position: fixed;
      left: 50%;
      bottom: var(--dock-bottom);
      z-index: 1001;
      width: min(calc((100vw - 2rem) * 0.7), 364px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .set-tabs-list:empty {
      display: none;
    }
    .set-tabs-list {
      display: flex;
      width: 100%;
      height: 3.25rem;
      box-sizing: border-box;
      align-items: stretch;
      gap: 0.25rem;
      padding: 0.25rem;
      border-radius: 999px;
      pointer-events: auto;
    }

    .set-tabs-list.glass-chip {
      border-radius: 999px;
    }

    .set-tab {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0 0.65rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.25;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s ease;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .set-tab-label {
      position: relative;
      z-index: 1;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set-tab-indicator {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--tab-active);
      /* NOTE: เบลอฉากหลังด้วย ไม่งั้นขาวโปร่งจะดูเหมือนขาวหม่นเฉยๆ ไม่ใช่กระจกฝ้า */
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 0;
    }

    .set-tab[aria-selected="true"] {
      color: var(--tab-active-text);
      font-weight: 600;
    }

    .set-tab[aria-selected="true"] .set-tab-indicator {
      opacity: 1;
    }

    .set-tab:hover:not([aria-selected="true"]) {
      color: #ced4da;
    }

    .set-tab:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }

    .dock-fab {
      width: 3.25rem;
      height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border: none;
      color: #f1f3f5;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .dock-fab.glass-chip {
      border-radius: 50%;
    }

    .dock-fab:hover {
      color: #fff;
      transform: scale(1.05);
    }

    .dock-fab svg,
    .dock-fab .lucide {
      display: block;
      width: 1rem;
      height: 1rem;
    }

    /* ── toggle PvE / Boss ลอยมุมขวาบน ───────────────────────── */
    .mode-toggle {
      position: fixed;
      top: calc(1rem + env(safe-area-inset-top, 0px));
      right: 1rem;
      z-index: 1002;
      display: flex;
      align-items: center;
      /* NOTE: wrap ไว้ด้วย จอแคบสองแคปซูลจะได้ตกบรรทัดแทนที่จะล้นออกนอกจอ */
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .mode-toggle[hidden] {
      display: none;
    }

    /* NOTE: ใช้ padding/gap ชุดเดียวกับ .set-tabs-list ให้จังหวะขอบตรงกัน */
    .mode-group {
      display: flex;
      gap: 0.25rem;
      padding: 0.25rem;
      border-radius: 999px;
    }

    /* ชื่อ set ในแคปซูลเดียวกับปุ่ม (แท็บ Compare) — เป็นป้ายเฉยๆ กดไม่ได้ */
    .mode-group-label {
      display: flex;
      align-items: center;
      padding: 0 0.5rem 0 0.65rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #e4e4e7;
      white-space: nowrap;
    }

    .mode-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      height: 1.875rem;
      padding: 0 0.65rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-option:hover {
      color: var(--text);
    }
    .mode-option.icon-only {
      padding: 0 0.7rem;
    }

    .mode-option[aria-pressed="true"] {
      background: var(--pill-active);
      color: #ecedee;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .mode-option svg,
    .mode-option .lucide {
      display: block;
      width: 1rem;
      height: 1rem;
    }

    /* ── ระหว่างรอ API ────────────────────────────────────────── */
    .page-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      animation: page-spin 0.7s linear infinite;
    }
    @keyframes page-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-loading-spinner {
        animation-duration: 2.4s;
      }
    }

    /* ── โหมดแก้ไข ───────────────────────────────────────────── */
    /* NOTE: ระดับเดียวกับปุ่ม i ฝั่งซ้าย — เมื่อก่อนต้องยกขึ้นหลบปุ่ม swap ที่ตอนนี้ไม่มีแล้ว */
    .add-menu {
      position: fixed;
      right: 1rem;
      bottom: var(--dock-bottom);
      z-index: 1002;
    }
    .add-menu[hidden] {
      display: none !important;
    }

    /* เมนูเลือก slot — โผล่ตอน hover ปุ่ม + หรือกดปุ่ม (จอสัมผัสไม่มี hover) */
    .add-menu-grid {
      position: absolute;
      right: 0;
      bottom: calc(100% + 0.5rem);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.25rem;
      padding: 0.35rem;
      border-radius: 1rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(0.25rem);
      transition: opacity 0.15s ease, visibility 0.15s ease, transform 0.15s ease;
    }
    .add-menu:hover .add-menu-grid,
    .add-menu:focus-within .add-menu-grid,
    .add-menu.is-open .add-menu-grid {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .add-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: none;
      border-radius: 0.65rem;
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-slot:hover {
      background: rgba(255, 255, 255, 0.16);
    }
    .add-slot img {
      width: 1.9rem;
      height: 1.9rem;
      object-fit: contain;
      /* NOTE: แค่ดึงให้สว่างขึ้น ไม่ใช้ brightness(0) invert(1) — อันนั้นได้เงาทึบ รายละเอียดหายหมด */
      filter: brightness(2.3);
      opacity: 0.9;
    }
    .add-slot:hover img {
      opacity: 1;
    }
    .edit-dialog {
      /* NOTE: * { margin: 0 } ข้างบนลบ margin: auto ที่เบราว์เซอร์ใช้จัดกลาง dialog — ต้องใส่คืน */
      margin: auto;
      width: min(44rem, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: 0;
      border: none;
      border-radius: 1rem;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    }
    .edit-dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
    }
    .edit-dialog form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      padding: 1.15rem;
    }
    .edit-previews {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }

    .edit-preview,
    .edit-form-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
    }

    .edit-preview .card,
    .edit-preview .grid-empty {
      width: 100%;
      height: auto;
      min-height: 11rem;
    }

    .edit-form-card {
      /* NOTE: อย่าให้กว้างเต็ม dialog — ช่อง Lv./power จะตกบรรทัดและล้นออกนอกการ์ด */
      width: 100%;
      max-width: 22rem;
      margin-inline: auto;
      padding-top: 0.75rem;
      border-top: 1px solid var(--divider);
    }

    /* NOTE: ต้องเป็น .card.edit-card — บล็อกนี้อยู่ก่อน .card ในไฟล์ ถ้าใช้คลาสเดียว
       specificity เท่ากันแล้ว .card { height: 100% } ที่อยู่ทีหลังจะชนะ */
    .card.edit-card {
      width: 100%;
      height: auto;
    }
    .edit-card .level,
    .edit-card .stats li {
      grid-template-columns: minmax(0, 1fr) 5.5rem;
      min-height: 2.4rem;
      column-gap: 0.4rem;
    }

    .edit-inline {
      width: 100%;
      min-width: 0;
      padding: 0.15rem 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0.35rem;
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font: inherit;
      text-align: right;
    }
    .edit-card .level .edit-inline {
      width: 3.6rem;
    }
    .edit-card .stats select {
      width: 100%;
      min-width: 0;
      padding: 0.15rem 0.2rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0.35rem;
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font: inherit;
      font-size: 0.72rem;
    }

    .edit-col-title {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #e4e4e7;
    }

    .edit-replace {
      background: var(--pill-active);
      border-color: rgba(255, 255, 255, 0.18);
      color: #f1f3f5;
      font-weight: 600;
    }

    @media (max-width: 40rem) {
      .edit-previews {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .edit-row {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      align-items: center;
      gap: 0.6rem;
    }
    .edit-row > label {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .edit-dialog input,
    .edit-dialog select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--divider);
      border-radius: 0.5rem;
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
    }
    .edit-dialog input:focus,
    .edit-dialog select:focus {
      outline: 2px solid rgba(255, 255, 255, 0.45);
      outline-offset: 1px;
    }
    .edit-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.25rem;
    }
    .edit-actions button {
      padding: 0.5rem 0.95rem;
      border: 1px solid var(--divider);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .edit-actions button[value="save"] {
      background: var(--pill-active);
      border-color: rgba(255, 255, 255, 0.18);
      color: #f1f3f5;
      font-weight: 600;
    }
    .edit-actions button[value="clear"] {
      margin-right: auto;
      color: #ff8787;
    }
    .edit-actions button[disabled] {
      opacity: 0.55;
      cursor: progress;
    }
    .edit-status {
      margin: 0;
      min-height: 1.1rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .edit-status[data-tone="error"] {
      color: #ff8787;
    }
    .edit-status[data-tone="ok"] {
      color: #69db7c;
    }

    .section { margin-bottom: 1.5rem; }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-header {
      margin-bottom: 1.25rem;
    }

    .section-title-row {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 0.5rem;
      max-width: 100%;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .grid-row-group {
      /* NOTE: คุมความกว้างที่ระดับ group ไม่ใช่ที่ .grid — แถบ tag จะได้ยาวเท่าการ์ด 3 ใบพอดี */
      max-width: calc(var(--card-max) * 3 + var(--card-gap) * 2);
      margin-inline: auto;
      margin-bottom: 1.1rem;
    }

    .grid-row-group:last-child {
      margin-bottom: 0;
    }

    .row-best-caption {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
      padding: 0.3rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      /* NOTE: กันความสูงไว้ให้แถวที่ไม่มี tag ด้วย ไม่งั้นกริดแต่ละแถวเหลื่อมกัน */
      min-height: 2.25rem;
    }

    /* ป้ายหัวแถบ: เป็นข้อความในกรอบเฉยๆ ไม่มีพื้นของตัวเอง (ชุดเดียวกับ .mode-group-label) */
    .best-label {
      display: inline-flex;
      align-items: center;
      padding: 0 0.3rem 0 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1;
      color: #e4e4e7;
      white-space: nowrap;
    }

    /* ทรง chip ของ HeroUI: พื้นทึบ ไม่มีขอบ มนเต็ม */
    .best-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1;
      color: #e4e4e7;
      white-space: nowrap;
    }

    .row-best-caption strong {
      color: #e9ecef;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, var(--card-max)));
      gap: var(--card-gap);
      align-items: stretch;
      justify-content: center;
      --equipment-card-min-height: 212px;
    }

    .card {
      --frame: #6b7280;
      --glow: rgba(255, 255, 255, 0.15);
      position: relative;
      background: var(--card);
      border-radius: 14px;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      height: 100%;
    }

    .card-body { padding: 8px; }

    /*
     * eternal เป็นเกรดสูงสุด — ให้เด่นกว่าเกรดอื่นด้วยไล่สีที่ name-bar
     */
    .card.eternal .name-bar {
      /* แถบสว่างกลาง เข้มหัวท้าย — ทรงเดียวกับป้าย Eternal ในเกม */
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--frame) 90%, #7e22ce) 0%,
        color-mix(in srgb, var(--glow) 80%, var(--frame)) 42%,
        color-mix(in srgb, var(--glow) 64%, var(--frame)) 60%,
        color-mix(in srgb, var(--frame) 94%, #7e22ce) 100%
      );
    }


    .name-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--glow) 55%, var(--frame)) 0%,
        var(--frame) 100%
      );
      border-radius: 0;
      padding: 8px;
      box-sizing: border-box;
      text-align: left;
      font-size: 0.83rem;
      font-weight: 700;
      line-height: 1.15;
      color: #0f1114;
      text-shadow: 0 1px 0 color-mix(in srgb, var(--glow) 40%, transparent);
    }

    .name-bar-icon-wrap {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
    }

    /* เลเวลเป็นป้ายเล็กมุมซ้ายบนของไอคอน */
    .level-badge {
      position: absolute;
      left: 4px;
      top: 4px;
      padding: 0.04rem 0.36rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .name-bar-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }

    .name-bar-text-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.15rem;
      min-height: calc(1.15em * 2);
    }

    /* power เป็นป้ายขาวใต้ชื่อ */
    .power-badge {
      flex-shrink: 0;
      max-width: 100%;
      padding: 0.05rem 0.4rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      font-size: 0.56rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.01em;
      color: #18181b;
      text-shadow: none;
      white-space: nowrap;
    }

    .name-bar-text {
      width: 100%;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .card.eternal .name-bar {
      color: #1e1b4b;
    }

    .card.legendary .name-bar {
      color: #422006;
    }

    .stat-primary-block {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-radius: 8px;
      min-height: 2.5rem;
      padding: 0 0.55rem;
      margin-bottom: 0.5rem;
      background: rgba(0, 0, 0, 0.15);
    }

    .stat-primary-block .label {
      color: #ced4da;
      font-weight: 700;
      font-size: 0.85rem;
      line-height: 1.15;
      align-self: center;
    }

    .stat-primary-block .value {
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.15;
      text-align: right;
      align-self: center;
    }

    .stats {
      list-style: none;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.15);
    }

    .stats li {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 0.5rem;
      position: relative;
      min-height: 2.6rem;
      padding: 0.25rem 0.8rem 0.25rem 0.55rem;
      font-size: 0.79rem;
      border-bottom: 1px solid var(--divider);
    }

    .stats li .label,
    .stats li .value {
      line-height: 1.15;
      align-self: center;
    }

    .stats li:last-child { border-bottom: none; }

    /* NOTE: substat ที่ไม่ตรง best ให้จางลง เกรดถึงจะเด่นออกมา (.stat-row-best ทับอีกที) */
    /* จุดมุมขวาบนของแถว substat: ฟ้า = โรลติดขอบบน 10%, แดง = ติดขอบล่าง 10% */
    .stat-flag {
      position: absolute;
      top: 0.3rem;
      right: 0.3rem;
      width: 0.34rem;
      height: 0.34rem;
      border-radius: 50%;
    }
    .stat-flag.is-high {
      background: #4dabf7;
      box-shadow: 0 0 4px rgba(77, 171, 247, 0.8);
    }
    .stat-flag.is-low {
      background: #ff6b6b;
      box-shadow: 0 0 4px rgba(255, 107, 107, 0.7);
    }

    /* ช่วงค่าที่เป็นไปได้ของ substat — เล็กและจาง อยู่ใต้ตัวเลขฝั่งขวา */
    .stat-range {
      display: block;
      margin-top: 0.1rem;
      font-size: 0.56rem;
      font-weight: 400;
      line-height: 1.1;
      text-align: right;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .stat-row-best .stat-range {
      color: rgba(255, 255, 255, 0.4);
    }

    .stats .label {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      justify-self: start;
    }

    .stats .value {
      color: rgba(255, 255, 255, 0.65);
      font-weight: 600;
      text-align: right;
      justify-self: end;
    }

    .card.eternal .stat-row-best .label,
    .card.eternal .stat-row-best .value {
      /* NOTE: ผูกกับ --glow ของการ์ด — แก้สีเกรดใน constants.mjs แล้วตรงนี้ตามเอง */
      color: var(--glow);
      font-weight: 600;
    }

    .card.legendary .stat-row-best .label,
    .card.legendary .stat-row-best .value {
      color: #fdba74;
      font-weight: 600;
    }

    /* ── แท็บ Compare ─────────────────────────────────────────── */
    .section.compare {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 1.5rem;
    }

    /* NOTE: section เป็น flex — หัวข้อต้องกินเต็มบรรทัด ไม่งั้นไปเบียดอยู่ข้างกล่องแรก */
    .section.compare .section-header {
      width: 100%;
    }

    .compare-group {
      /* กว้างเท่าการ์ด 2 ใบ ไม่ใช่ 3 เหมือนแถวปกติ */
      max-width: calc(var(--card-max) * 2 + var(--card-gap));
    }

    /* หัวกล่องมีแค่ชื่อ slot ไม่มี tag ต่อท้าย เลยไม่ต้องมีแถบรอง */
    .compare-group .row-best-caption {
      margin-bottom: 0.45rem;
      padding: 0;
      min-height: 0;
      background: none;
    }

    .compare-group .best-label {
      align-self: flex-start;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.875rem;
    }

    .compare-grid {
      grid-template-columns: repeat(2, minmax(0, var(--card-max)));
    }

    .compare-cell {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
    }

    .compare-set {
      padding-left: 0.2rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.5);
    }

    .grid-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      min-height: 0;
      height: 100%;
      border-radius: 14px;
      border: 2px dashed rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.12);
    }

    .grid:not(:has(.card)) .grid-empty {
      min-height: var(--equipment-card-min-height);
    }

    .grid-empty-plate {
      width: 72px;
      height: 72px;
      object-fit: contain;
      opacity: 0.22;
      pointer-events: none;
      user-select: none;
    }

    .summary-hover {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .summary-float {
      position: fixed;
      left: 1rem;
      right: auto;
      bottom: var(--dock-bottom);
      z-index: 1002;
    }

    .summary-popover {
      position: absolute;
      left: 0;
      right: auto;
      bottom: calc(100% + 0.55rem);
      top: auto;
      z-index: 100;
      width: max-content;
      min-width: 11rem;
      max-width: min(16rem, calc(100vw - 2rem));
      padding: 0;
      background: rgba(22, 24, 28, 0.72);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition:
        opacity 0.16s ease,
        transform 0.16s ease,
        visibility 0.16s;
      pointer-events: none;
    }

    .summary-hover:hover .summary-popover,
    .summary-hover:focus-within .summary-popover {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .summary-table-wrap {
      max-height: min(50vh, 20rem);
      overflow-x: auto;
      overflow-y: auto;
      padding: 0.35rem 0.25rem;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      line-height: 1.35;
    }

    .summary-table td {
      padding: 0.35rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: middle;
    }

    .summary-table td.stat-label {
      font-weight: 500;
      color: #adb5bd;
      white-space: nowrap;
      padding-right: 0.75rem;
    }

    .summary-table td.stat-total {
      font-weight: 600;
      color: #f1f3f5;
      white-space: nowrap;
      text-align: right;
      padding-left: 0.5rem;
      padding-right: 0.35rem;
      font-variant-numeric: tabular-nums;
    }

    .summary-table tbody tr:last-child td {
      border-bottom: none;
    }

    .page-load-error {
      margin: 0 0 1rem;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(127, 29, 29, 0.25);
      color: #fecaca;
      font-size: 0.8125rem;
    }
  </style>
</head>
