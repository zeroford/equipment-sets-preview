
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipment Sets</title>
  <style>
    :root {
      --bg: #0f1114;
      --card: #2a2e33;
      --text: #f1f3f5;
      --muted: #868e96;
      --divider: rgba(255, 255, 255, 0.08);
      /* tab bar ล่าง = ตัวเลือกหลัก, toggle/ปุ่ม Save = ระดับรอง */
      --tab-active: rgba(255, 255, 255, 0.86);
      --tab-active-text: #18181b;
      --pill-active: #3f3f46;
      --card-max: 175px;
      --card-gap: 1rem;
      --dock-bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
      --dock-scroll-pad: calc(4.35rem + env(safe-area-inset-bottom, 0px));
    }

    .glass-chip {
      /*
       * NOTE: พื้นต้องสว่างกว่า --bg พอสมควร ไม่งั้นปุ่มลอยกลืนไปกับพื้นหลัง
       * ใช้ zinc-800 ชุดเดียวกับ .best-tag ให้ผิวลอยทั้งหน้าเป็นโทนเดียวกัน
       */
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(39, 39, 42, 0.85);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem var(--dock-scroll-pad);
    }

    .page { max-width: 1200px; margin: 0 auto; }

    /* จอกว้าง: วาง row-group เป็น 2 คอลัมน์ ได้การ์ด 3 3 / 3 3 แทนที่จะเรียงลงยาว 4 แถว */
    @media (min-width: 1080px) {
      .page {
        max-width: none;
      }
      .section {
        display: grid;
        /*
         * กว้างสุดเท่าการ์ด 3 ใบ ไม่ใช้ 1fr — ไม่งั้นแถบ tag ด้านบนจะยืดเกินแนวการ์ด
         * NOTE: ต้องเป็น minmax(0, …) ไม่ใช่ค่าตายตัว — ช่วงจอ 1080–1245px
         * สองคอลัมน์รวมกันกว้างกว่าจอ ถ้าหดไม่ได้จะล้นออกนอกจอทั้งซ้ายและขวา
         */
        grid-template-columns: repeat(2, minmax(0, calc(var(--card-max) * 3 + var(--card-gap) * 2)));
        justify-content: center;
        column-gap: 1.5rem;
        align-items: start;
      }
      .section-header {
        grid-column: 1 / -1;
      }
    }

    .section[hidden] {
      display: none !important;
    }

    .set-tabs {
      position: fixed;
      left: 50%;
      bottom: var(--dock-bottom);
      z-index: 1001;
      width: min(calc((100vw - 2rem) * 0.7), 364px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .set-tabs-list:empty {
      display: none;
    }
    .set-tabs-list {
      display: flex;
      width: 100%;
      height: 3.25rem;
      box-sizing: border-box;
      align-items: stretch;
      gap: 0.25rem;
      padding: 0.25rem;
      border-radius: 999px;
      pointer-events: auto;
    }

    .set-tabs-list.glass-chip {
      border-radius: 999px;
    }

    .set-tab {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0 0.65rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.25;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s ease;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .set-tab-label {
      position: relative;
      z-index: 1;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set-tab-indicator {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--tab-active);
      /* NOTE: เบลอฉากหลังด้วย ไม่งั้นขาวโปร่งจะดูเหมือนขาวหม่นเฉยๆ ไม่ใช่กระจกฝ้า */
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 0;
    }

    .set-tab[aria-selected="true"] {
      color: var(--tab-active-text);
      font-weight: 600;
    }

    .set-tab[aria-selected="true"] .set-tab-indicator {
      opacity: 1;
    }

    .set-tab:hover:not([aria-selected="true"]) {
      color: #ced4da;
    }

    .set-tab:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }

    .dock-fab {
      width: 3.25rem;
      height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border: none;
      color: #f1f3f5;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .dock-fab.glass-chip {
      border-radius: 50%;
    }

    .dock-fab:hover {
      color: #fff;
      transform: scale(1.05);
    }

    .dock-fab svg,
    .dock-fab .lucide {
      display: block;
      width: 1rem;
      height: 1rem;
    }

    /* ── toggle PvE / Boss ลอยมุมขวาบน ───────────────────────── */
    .mode-toggle {
      position: fixed;
      top: calc(1rem + env(safe-area-inset-top, 0px));
      right: 1rem;
      z-index: 1002;
      display: flex;
      /* NOTE: ใช้ padding/gap ชุดเดียวกับ .set-tabs-list ให้จังหวะขอบตรงกัน */
      gap: 0.25rem;
      padding: 0.25rem;
      border-radius: 999px;
    }
    .mode-toggle[hidden] {
      display: none;
    }
    .mode-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      height: 1.875rem;
      padding: 0 0.65rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-option:hover {
      color: var(--text);
    }
    .mode-option[aria-pressed="true"] {
      background: var(--pill-active);
      color: #ecedee;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .mode-option svg,
    .mode-option .lucide {
      display: block;
      width: 1rem;
      height: 1rem;
    }

    /* ── ระหว่างรอ API ────────────────────────────────────────── */
    .page-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      animation: page-spin 0.7s linear infinite;
    }
    @keyframes page-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-loading-spinner {
        animation-duration: 2.4s;
      }
    }

    /* ── โหมดแก้ไข ───────────────────────────────────────────── */
    .edit-fab {
      position: fixed;
      right: 1rem;
      left: auto;
      /* NOTE: ระดับเดียวกับปุ่ม i ฝั่งซ้าย — เมื่อก่อนต้องยกขึ้นหลบปุ่ม swap ที่ตอนนี้ไม่มีแล้ว */
      bottom: var(--dock-bottom);
      z-index: 1002;
    }
    .edit-fab[hidden] {
      display: none !important;
    }
    .edit-fab[aria-pressed="true"] {
      background: rgba(255, 255, 255, 0.38);
      border-color: rgba(255, 255, 255, 0.42);
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        0 1px 3px rgba(0, 0, 0, 0.22);
    }
    /* การ์ดกดได้เฉพาะตอนเปิดโหมดแก้ไข */
    body.is-editing .card,
    body.is-editing .grid-empty {
      cursor: pointer;
      outline: 1px dashed rgba(255, 255, 255, 0.28);
      outline-offset: 2px;
    }
    body.is-editing .card:hover,
    body.is-editing .grid-empty:hover {
      outline-color: rgba(255, 255, 255, 0.6);
    }

    .edit-dialog {
      width: min(26rem, calc(100vw - 2rem));
      padding: 0;
      border: none;
      border-radius: 1rem;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    }
    .edit-dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
    }
    .edit-dialog form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      padding: 1.15rem;
    }
    .edit-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .edit-sub {
      margin: -0.55rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .edit-row {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      align-items: center;
      gap: 0.6rem;
    }
    .edit-row.edit-row-pair {
      grid-template-columns: 6.5rem 1fr 6.5rem;
    }
    .edit-row > label {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .edit-dialog input,
    .edit-dialog select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--divider);
      border-radius: 0.5rem;
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
    }
    .edit-dialog input:focus,
    .edit-dialog select:focus {
      outline: 2px solid rgba(255, 255, 255, 0.45);
      outline-offset: 1px;
    }
    .edit-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.25rem;
    }
    .edit-actions button {
      padding: 0.5rem 0.95rem;
      border: 1px solid var(--divider);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .edit-actions button[value="save"] {
      background: var(--pill-active);
      border-color: rgba(255, 255, 255, 0.18);
      color: #f1f3f5;
      font-weight: 600;
    }
    .edit-actions button[value="clear"] {
      margin-right: auto;
      color: #ff8787;
    }
    .edit-actions button[disabled] {
      opacity: 0.55;
      cursor: progress;
    }
    .edit-status {
      margin: 0;
      min-height: 1.1rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .edit-status[data-tone="error"] {
      color: #ff8787;
    }
    .edit-status[data-tone="ok"] {
      color: #69db7c;
    }

    .section { margin-bottom: 1.5rem; }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-header {
      margin-bottom: 1.25rem;
    }

    .section-title-row {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 0.5rem;
      max-width: 100%;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .grid-row-group {
      /* NOTE: คุมความกว้างที่ระดับ group ไม่ใช่ที่ .grid — แถบ tag จะได้ยาวเท่าการ์ด 3 ใบพอดี */
      max-width: calc(var(--card-max) * 3 + var(--card-gap) * 2);
      margin-inline: auto;
      margin-bottom: 1.1rem;
    }

    .grid-row-group:last-child {
      margin-bottom: 0;
    }

    .row-best-caption {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
      /* NOTE: ขอบมนเต็ม ต้องเพิ่ม padding แนวนอนด้วย ไม่งั้น tag แรกไปทับส่วนโค้ง */
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      /* NOTE: กันความสูงไว้ให้แถวที่ไม่มี tag ด้วย ไม่งั้นกริดแต่ละแถวเหลื่อมกัน */
      min-height: 2.25rem;
    }

    /* ทรง chip ของ HeroUI: พื้นทึบ ไม่มีขอบ มนเต็ม */
    .best-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1;
      color: #e4e4e7;
      white-space: nowrap;
    }

    .row-best-caption strong {
      color: #e9ecef;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, var(--card-max)));
      gap: var(--card-gap);
      align-items: stretch;
      justify-content: center;
      --equipment-card-min-height: 212px;
    }

    .card {
      --frame: #6b7280;
      --glow: rgba(255, 255, 255, 0.15);
      position: relative;
      background: var(--card);
      border-radius: 14px;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      height: 100%;
    }

    .card-body { padding: 8px; }

    .meta {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 0.75rem;
      margin-inline: -8px;
      padding: 4px 16px;
      margin-bottom: 0.55rem;
    }

    .level {
      justify-self: start;
      align-self: center;
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1;
      color: #dee2e6;
    }

    .card.legendary .level {
      color: #fb923c;
    }

    .card.eternal .level {
      /* NOTE: โทนเดียวกับ name-bar และ highlight — ผูกกับ --glow ทั้งหมด */
      color: var(--glow);
    }

    /*
     * eternal เป็นเกรดสูงสุด — ให้เด่นกว่าเกรดอื่นด้วยไล่สี 3 จุด
     * (สว่างอมชมพูตรงกลาง เข้มที่ขอบล่าง) + แสงเรืองรอบการ์ด
     */
    .card.eternal .name-bar {
      /* แถบสว่างกลาง เข้มหัวท้าย — ทรงเดียวกับป้าย Eternal ในเกม */
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--frame) 90%, #7e22ce) 0%,
        color-mix(in srgb, var(--glow) 80%, var(--frame)) 42%,
        color-mix(in srgb, var(--glow) 64%, var(--frame)) 60%,
        color-mix(in srgb, var(--frame) 94%, #7e22ce) 100%
      );
    }

    .card.eternal {
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(240, 171, 252, 0.28),
        0 0 22px -8px rgba(192, 132, 252, 0.75);
    }

    .meta-power {
      justify-self: end;
      align-self: center;
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .name-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--glow) 55%, var(--frame)) 0%,
        var(--frame) 100%
      );
      border-radius: 0;
      padding: 8px;
      box-sizing: border-box;
      text-align: left;
      font-size: 0.97rem;
      font-weight: 700;
      line-height: 1.15;
      color: #0f1114;
      text-shadow: 0 1px 0 color-mix(in srgb, var(--glow) 40%, transparent);
    }

    .name-bar-icon-wrap {
      flex-shrink: 0;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
    }

    .name-bar-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }

    .name-bar-text-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      min-height: calc(1.15em * 2);
    }

    .name-bar-text {
      width: 100%;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .card.eternal .name-bar {
      color: #1e1b4b;
    }

    .card.legendary .name-bar {
      color: #422006;
    }

    .stat-primary-block {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-radius: 8px;
      min-height: 2.5rem;
      padding: 0 0.55rem;
      margin-bottom: 0.5rem;
      background: rgba(0, 0, 0, 0.15);
    }

    .stat-primary-block .label {
      color: #ced4da;
      font-weight: 700;
      font-size: 0.85rem;
      line-height: 1.15;
      align-self: center;
    }

    .stat-primary-block .value {
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.15;
      text-align: right;
      align-self: center;
    }

    .stats {
      list-style: none;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.15);
    }

    .stats li {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 0.5rem;
      min-height: 2.1rem;
      padding: 0 0.55rem;
      font-size: 0.79rem;
      border-bottom: 1px solid var(--divider);
    }

    .stats li .label,
    .stats li .value {
      line-height: 1.15;
      align-self: center;
    }

    .stats li:last-child { border-bottom: none; }

    .stats .label {
      color: #ced4da;
      font-weight: 500;
      justify-self: start;
    }

    .stats .value {
      color: #fff;
      font-weight: 600;
      text-align: right;
      justify-self: end;
    }

    .card.eternal .stat-row-best .label,
    .card.eternal .stat-row-best .value {
      /* NOTE: ผูกกับ --glow ของการ์ด — แก้สีเกรดใน constants.mjs แล้วตรงนี้ตามเอง */
      color: var(--glow);
      font-weight: 600;
    }

    .card.legendary .stat-row-best .label,
    .card.legendary .stat-row-best .value {
      color: #fdba74;
      font-weight: 600;
    }

    .grid-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      min-height: 0;
      height: 100%;
      border-radius: 14px;
      border: 2px dashed rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.12);
    }

    .grid:not(:has(.card)) .grid-empty {
      min-height: var(--equipment-card-min-height);
    }

    .grid-empty-plate {
      width: 72px;
      height: 72px;
      object-fit: contain;
      opacity: 0.22;
      pointer-events: none;
      user-select: none;
    }

    .summary-hover {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .summary-float {
      position: fixed;
      left: 1rem;
      right: auto;
      bottom: var(--dock-bottom);
      z-index: 1002;
    }

    .summary-popover {
      position: absolute;
      left: 0;
      right: auto;
      bottom: calc(100% + 0.55rem);
      top: auto;
      z-index: 100;
      width: max-content;
      min-width: 11rem;
      max-width: min(16rem, calc(100vw - 2rem));
      padding: 0;
      background: rgba(22, 24, 28, 0.72);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition:
        opacity 0.16s ease,
        transform 0.16s ease,
        visibility 0.16s;
      pointer-events: none;
    }

    .summary-hover:hover .summary-popover,
    .summary-hover:focus-within .summary-popover {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .summary-table-wrap {
      max-height: min(50vh, 20rem);
      overflow-x: auto;
      overflow-y: auto;
      padding: 0.35rem 0.25rem;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      line-height: 1.35;
    }

    .summary-table td {
      padding: 0.35rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: middle;
    }

    .summary-table td.stat-label {
      font-weight: 500;
      color: #adb5bd;
      white-space: nowrap;
      padding-right: 0.75rem;
    }

    .summary-table td.stat-total {
      font-weight: 600;
      color: #f1f3f5;
      white-space: nowrap;
      text-align: right;
      padding-left: 0.5rem;
      padding-right: 0.35rem;
      font-variant-numeric: tabular-nums;
    }

    .summary-table tbody tr:last-child td {
      border-bottom: none;
    }

    .page-load-error {
      margin: 0 0 1rem;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(127, 29, 29, 0.25);
      color: #fecaca;
      font-size: 0.8125rem;
    }
  </style>
