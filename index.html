
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipment Sets</title>
  <style>
    :root {
      --bg: #0f1114;
      --card: #2a2e33;
      --text: #f1f3f5;
      --muted: #868e96;
      --divider: rgba(255, 255, 255, 0.08);
      /* tab bar ล่าง = ตัวเลือกหลัก, toggle/ปุ่ม Save = ระดับรอง */
      --tab-active: rgba(255, 255, 255, 0.86);
      --tab-active-text: #18181b;
      --pill-active: #3f3f46;
      --card-min: 168px;
      --card-max: 200px;
      --card-gap: 1rem;
      --dock-bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
      --dock-scroll-pad: calc(4.35rem + env(safe-area-inset-bottom, 0px));
    }

    .glass-chip {
      /*
       * NOTE: พื้นต้องสว่างกว่า --bg พอสมควร ไม่งั้นปุ่มลอยกลืนไปกับพื้นหลัง
       * ใช้ zinc-800 ชุดเดียวกับ .best-tag ให้ผิวลอยทั้งหน้าเป็นโทนเดียวกัน
       */
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(39, 39, 42, 0.85);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem var(--dock-scroll-pad);
    }

    .page { max-width: 1200px; margin: 0 auto; }

    /* จอกว้าง: วาง row-group เป็น 2 คอลัมน์ ได้การ์ด 3 3 / 3 3 แทนที่จะเรียงลงยาว 4 แถว */
    @media (min-width: 1120px) {
      .page {
        max-width: none;
      }
      .section {
        display: grid;
        /*
         * กว้างสุดเท่าการ์ด 3 ใบ ไม่ใช้ 1fr — ไม่งั้นแถบ tag ด้านบนจะยืดเกินแนวการ์ด
         * NOTE: ต้องเป็น minmax(0, …) ไม่ใช่ค่าตายตัว — ช่วงจอ 1120–1290px
         * สองคอลัมน์รวมกันกว้างกว่าจอ ถ้าหดไม่ได้จะล้นออกนอกจอทั้งซ้ายและขวา
         */
        grid-template-columns: repeat(2, minmax(0, calc(var(--card-max) * 3 + var(--card-gap) * 2)));
        /* แถวหัวข้อ + แถวการ์ดอีก 2 */
        grid-template-rows: auto auto auto;
        /*
         * ไล่ลงก่อนแล้วค่อยข้ามคอลัมน์ ให้ slot เรียง
         *   1 2 3 | 7 8 9
         *   4 5 6 | 10 11 12
         * ถ้าใช้ flow แบบแถว จะได้ 1-3 | 4-6 / 7-9 | 10-12 ซึ่งอ่านข้ามไปมา
         */
        grid-auto-flow: column;
        justify-content: center;
        column-gap: 1.5rem;
        align-items: start;
      }
      .section-header {
        grid-column: 1 / -1;
        grid-row: 1;
      }
    }

    .section[hidden] {
      display: none !important;
    }

    .set-tabs {
      position: fixed;
      left: 50%;
      bottom: var(--dock-bottom);
      z-index: 1001;
      width: min(calc((100vw - 2rem) * 0.7), 364px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .set-tabs-list:empty {
      display: none;
    }
    .set-tabs-list {
      display: flex;
      width: 100%;
      height: 3.25rem;
      box-sizing: border-box;
      align-items: stretch;
      gap: 0.25rem;
      padding: 0.25rem;
      border-radius: 999px;
      pointer-events: auto;
    }

    .set-tabs-list.glass-chip {
      border-radius: 999px;
    }

    .set-tab {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0 0.65rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.25;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s ease;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .set-tab-label {
      position: relative;
      z-index: 1;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set-tab-indicator {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--tab-active);
      /* NOTE: เบลอฉากหลังด้วย ไม่งั้นขาวโปร่งจะดูเหมือนขาวหม่นเฉยๆ ไม่ใช่กระจกฝ้า */
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 0;
    }

    .set-tab[aria-selected="true"] {
      color: var(--tab-active-text);
      font-weight: 600;
    }

    .set-tab[aria-selected="true"] .set-tab-indicator {
      opacity: 1;
    }

    .set-tab:hover:not([aria-selected="true"]) {
      color: #ced4da;
    }

    .set-tab:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }

    .dock-fab {
      width: 3.25rem;
      height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border: none;
      color: #f1f3f5;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .dock-fab.glass-chip {
      border-radius: 50%;
    }

    .dock-fab:hover {
      color: #fff;
      transform: scale(1.05);
    }

    .dock-fab svg,
    .dock-fab .lucide {
      display: block;
      width: 1rem;
      height: 1rem;
    }

    /* ── toggle PvE / Boss ลอยมุมขวาบน ───────────────────────── */
    .mode-toggle {
      position: fixed;
      top: calc(1rem + env(safe-area-inset-top, 0px));
      right: 1rem;
      z-index: 1002;
      display: flex;
      align-items: center;
      /* NOTE: wrap ไว้ด้วย จอแคบสองแคปซูลจะได้ตกบรรทัดแทนที่จะล้นออกนอกจอ */
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .mode-toggle[hidden] {
      display: none;
    }

    /* NOTE: ใช้ padding/gap ชุดเดียวกับ .set-tabs-list ให้จังหวะขอบตรงกัน */
    .mode-group,
    .rarity-group {
      display: flex;
      gap: 0.25rem;
      padding: 0.25rem;
      border-radius: 999px;
    }

    /* ชื่อ set ในแคปซูลเดียวกับปุ่ม (แท็บ Compare) — เป็นป้ายเฉยๆ กดไม่ได้ */
    .mode-group-label {
      display: flex;
      align-items: center;
      padding: 0 0.5rem 0 0.65rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #e4e4e7;
      white-space: nowrap;
    }

    .mode-option,
    .rarity-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      height: 1.875rem;
      padding: 0 0.65rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-option:hover,
    .rarity-option:hover {
      color: var(--text);
    }
    .mode-option.icon-only {
      padding: 0 0.7rem;
    }

    .mode-option[aria-pressed="true"],
    .rarity-option[aria-pressed="true"] {
      background: var(--pill-active);
      color: #ecedee;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .mode-option svg,
    .mode-option .lucide {
      display: block;
      width: 1rem;
      height: 1rem;
    }

    /* ── ระหว่างรอ API ────────────────────────────────────────── */
    .page-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      animation: page-spin 0.7s linear infinite;
    }
    @keyframes page-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-loading-spinner {
        animation-duration: 2.4s;
      }
    }

    /* ── โหมดแก้ไข ───────────────────────────────────────────── */
    /* NOTE: ระดับเดียวกับปุ่ม i ฝั่งซ้าย — เมื่อก่อนต้องยกขึ้นหลบปุ่ม swap ที่ตอนนี้ไม่มีแล้ว */
    .add-menu {
      position: fixed;
      right: 1rem;
      bottom: var(--dock-bottom);
      z-index: 1002;
    }
    .add-menu[hidden] {
      display: none !important;
    }

    /* เมนูเลือก slot — โผล่ตอน hover ปุ่ม + หรือกดปุ่ม (จอสัมผัสไม่มี hover) */
    .add-menu-grid {
      position: absolute;
      right: 0;
      bottom: calc(100% + 0.5rem);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.25rem;
      padding: 0.35rem;
      border-radius: 1rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(0.25rem);
      transition: opacity 0.15s ease, visibility 0.15s ease, transform 0.15s ease;
    }
    .add-menu:hover .add-menu-grid,
    .add-menu:focus-within .add-menu-grid,
    .add-menu.is-open .add-menu-grid {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .add-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: none;
      border-radius: 0.65rem;
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-slot:hover {
      background: rgba(255, 255, 255, 0.16);
    }
    .add-slot img {
      width: 1.9rem;
      height: 1.9rem;
      object-fit: contain;
      /* NOTE: แค่ดึงให้สว่างขึ้น ไม่ใช้ brightness(0) invert(1) — อันนั้นได้เงาทึบ รายละเอียดหายหมด */
      filter: brightness(2.3);
      opacity: 0.9;
    }
    .add-slot:hover img {
      opacity: 1;
    }
    .edit-dialog {
      /* NOTE: * { margin: 0 } ข้างบนลบ margin: auto ที่เบราว์เซอร์ใช้จัดกลาง dialog — ต้องใส่คืน */
      margin: auto;
      width: min(40rem, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: 0;
      border: none;
      border-radius: 1rem;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    }
    .edit-dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
    }
    .edit-dialog form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      padding: 1.15rem;
    }

    .edit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--divider);
    }
    .edit-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #f4f4f5;
    }
    .edit-close {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 1.9rem;
      height: 1.9rem;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #a1a1aa;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .edit-close:hover {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
    }
    .edit-close:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.35);
      outline-offset: 1px;
    }
    .edit-close svg {
      width: 0.95rem;
      height: 0.95rem;
    }
    .edit-cols {
      display: grid;
      /* ซ้ายพอดีการ์ด ที่เหลือให้ฟอร์ม — ฟอร์มมีช่องกรอก ต้องการที่มากกว่า */
      grid-template-columns: var(--card-max) minmax(0, 1fr);
      align-items: stretch;
      gap: 1.1rem;
    }

    /* NOTE: grid ไม่มี column-rule — ต้องแปะเส้นที่คอลัมน์ขวาเอง (align-items: stretch
       ข้างบนคือสิ่งที่ทำให้เส้นยาวเต็มความสูง ไม่ใช่แค่เท่าเนื้อหาในคอลัมน์) */
    .edit-cols > .edit-col + .edit-col {
      padding-left: 1.1rem;
      border-left: 1px solid var(--divider);
    }

    .edit-col {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-width: 0;
    }

    .edit-preview,
    .edit-form-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
    }

    .edit-preview .card,
    .edit-preview .grid-empty {
      width: var(--card-max);
      height: auto;
      min-height: 11rem;
    }

    .edit-form-card {
      position: relative;
      width: 100%;
    }

    /* ไอคอนในการ์ดฟอร์มเป็นปุ่มเปิดตารางเลือก slot */
    .slot-pick {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /*
     * NOTE: ลอยเทียบกับ .edit-form-card ไม่ใช่ .card — .card มี overflow: hidden
     * ถ้าอยู่ข้างในจะโดนตัดหายไปเกือบหมด ส่วน top/left ตั้งจาก JS ตอนเปิด
     */
    .slot-picker {
      position: absolute;
      z-index: 20;
      display: grid;
      /* ขนาดคงที่เท่าเมนูปุ่ม + */
      grid-template-columns: repeat(6, 2.5rem);
      gap: 0.25rem;
      padding: 0.35rem;
      border-radius: 1rem;
    }
    .slot-picker[hidden] {
      display: none;
    }
    .slot-picker .add-slot[aria-pressed='true'] {
      background: var(--pill-active);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    /*
     * แถบชื่อของการ์ดฟอร์มเป็น 2 บรรทัด: ชื่อ / Lv. + rarity
     * ไอคอนเกาะบนสุด ไม่ใช่กลางแนวตั้ง เพราะฝั่งขวาสูงกว่าหนึ่งบรรทัด
     */
    .edit-name-bar {
      align-items: flex-start;
    }
    /* 45 → 68px (×1.5) ไอคอนในนี้เป็นปุ่มเลือก slot ด้วย ใหญ่แล้วกดง่ายขึ้น */
    .edit-card .name-bar-icon-wrap {
      width: 68px;
      height: 68px;
    }
    .edit-card .name-bar-icon {
      width: 54px;
      height: 54px;
    }
    .edit-card .name-bar-text {
      font-size: 1rem;
    }
    .edit-name-lines {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex: 1;
      min-width: 0;
    }
    .edit-name-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* บนแถบชื่อสว่าง ตัวควบคุมต้องเป็นพื้นดำโปร่ง ไม่ใช่ขาวโปร่งแบบที่ใช้บนพื้นมืด */
    .edit-lv {
      display: inline-flex;
      align-items: center;
      gap: 0.12rem;
      height: 1.7rem;
      padding: 0 0.5rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }
    .edit-name-controls .rarity-group {
      gap: 0.15rem;
      padding: 0.14rem;
      background: rgba(0, 0, 0, 0.28);
    }
    .edit-name-controls .rarity-option {
      height: 1.42rem;
      padding: 0 0.55rem;
      font-size: 0.72rem;
      color: rgba(0, 0, 0, 0.55);
    }
    .edit-name-controls .rarity-option:hover {
      color: rgba(0, 0, 0, 0.8);
    }
    .edit-name-controls .rarity-option[aria-pressed='true'] {
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      box-shadow: none;
    }

    .edit-dialog .level-input {
      width: 1.95rem;
      height: auto;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: center;
    }
    .edit-dialog .level-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    /*
     * NOTE: กันที่ให้ % และช่วงค่าไว้ตลอด ไม่ว่าจะมีของจริงหรือยัง — % ใช้ visibility
     * ส่วนช่วงค่ากันด้วย min-height ไม่งั้นแถวจะกระโดดทุกครั้งที่เปลี่ยนชนิด stat
     */
    .edit-sub-input {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      min-width: 0;
    }
    .edit-unit {
      flex-shrink: 0;
      width: 0.6rem;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.55);
    }
    .edit-card .stat-range {
      min-height: 0.72rem;
    }


    /* NOTE: ต้องเป็น .card.edit-card — บล็อกนี้อยู่ก่อน .card ในไฟล์ ถ้าใช้คลาสเดียว
       specificity เท่ากันแล้ว .card { height: 100% } ที่อยู่ทีหลังจะชนะ */
    .card.edit-card {
      width: 100%;
      height: auto;
    }
    .edit-card .stats li {
      grid-template-columns: minmax(0, 1fr) 5.5rem;
      align-items: start;
      min-height: 2.4rem;
      column-gap: 0.4rem;
    }

    /* ลูกศรขึ้น/ลงของ input[type=number] เกะกะในช่องแคบๆ — ไม่ได้ใช้กดอยู่แล้ว */
    .edit-dialog input[type='number'] {
      appearance: textfield;
      -moz-appearance: textfield;
    }
    .edit-dialog input[type='number']::-webkit-outer-spin-button,
    .edit-dialog input[type='number']::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .edit-sub-value {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      min-width: 0;
    }

    /* NOTE: ล็อกความสูงทั้งคู่ — select กับ input คิดความสูงจาก UA คนละแบบ
       ปล่อยตาม padding อย่างเดียวจะไม่มีวันเท่ากัน */
    .edit-card .stats select,
    .edit-inline {
      height: 1.85rem;
    }

    .edit-inline[readonly] {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      cursor: default;
    }

    .edit-inline {
      width: 100%;
      min-width: 0;
      padding: 0.15rem 0.5rem;
      text-align: right;
    }
    /*
     * Power กรอกตรงช่องที่ค่ามันจะไปโผล่ — แต่งให้เหมือนตัวเลขในการ์ด ไม่ใช่กล่องฟอร์ม
     * เส้นประใต้ตัวเลขคือสิ่งเดียวที่บอกว่าพิมพ์ได้
     */
    .edit-dialog .power-input {
      width: 5.2rem;
      height: auto;
      padding: 0 0 0.1rem;
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.28);
      border-radius: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      text-align: right;
    }

    .edit-card .stats select {
      width: 100%;
      min-width: 0;
      padding: 0.15rem 1.6rem 0.15rem 0.5rem;
      background-position: right 0.45rem center;
      background-size: 0.75rem;
      font-size: 0.72rem;
    }

    .edit-col-title {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #e4e4e7;
    }

    .edit-replace {
      background: var(--pill-active);
      border-color: rgba(255, 255, 255, 0.18);
      color: #f1f3f5;
      font-weight: 600;
    }

    @media (max-width: 40rem) {
      :root {
        --card-min: 0px;
      }
      .edit-cols {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    /*
     * ทรงฟิลด์แบบ HeroUI — พื้นทึบอ่อน ไม่มีเส้นขอบ มุมมน ลูกศรของ select วาดเอง
     * NOTE: ต้อง appearance: none ก่อน ไม่งั้นลูกศรของระบบยังค้างอยู่ทับอันที่วาดเอง
     */
    .edit-dialog input,
    .edit-dialog select {
      width: 100%;
      padding: 0.45rem 0.7rem;
      border: none;
      border-radius: 0.65rem;
      background-color: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
    }
    .edit-dialog select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 1.9rem;
      background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a1a1aa%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E');
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 0.85rem;
      cursor: pointer;
    }
    .edit-dialog input:hover,
    .edit-dialog select:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .edit-dialog input:focus,
    .edit-dialog select:focus {
      outline: 2px solid rgba(255, 255, 255, 0.35);
      outline-offset: 1px;
    }
    .edit-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: auto;
      padding-top: 0.85rem;
      border-top: 1px solid var(--divider);
    }
    .edit-actions button {
      padding: 0.5rem 0.95rem;
      border: 1px solid var(--divider);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .edit-actions button[value="save"] {
      background: var(--pill-active);
      border-color: rgba(255, 255, 255, 0.18);
      color: #f1f3f5;
      font-weight: 600;
    }
    .edit-actions button[value="clear"] {
      margin-right: auto;
      color: #ff8787;
    }
    .edit-actions button[disabled] {
      opacity: 0.55;
      cursor: progress;
    }
    .edit-status {
      margin: 0;
      min-height: 1.1rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .edit-status[data-tone="error"] {
      color: #ff8787;
    }
    .edit-status[data-tone="ok"] {
      color: #69db7c;
    }

    .section { margin-bottom: 1.5rem; }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-header {
      margin-bottom: 1.25rem;
    }

    .section-title-row {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 0.5rem;
      max-width: 100%;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .grid-row-group {
      /* NOTE: คุมความกว้างที่ระดับ group ไม่ใช่ที่ .grid — แถบ tag จะได้ยาวเท่าการ์ด 3 ใบพอดี */
      max-width: calc(var(--card-max) * 3 + var(--card-gap) * 2);
      margin-inline: auto;
      margin-bottom: 1.1rem;
    }

    .grid-row-group:last-child {
      margin-bottom: 0;
    }

    .row-best-caption {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
      padding: 0.3rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      /* NOTE: กันความสูงไว้ให้แถวที่ไม่มี tag ด้วย ไม่งั้นกริดแต่ละแถวเหลื่อมกัน */
      min-height: 2.25rem;
    }

    /* ป้ายหัวแถบ: เป็นข้อความในกรอบเฉยๆ ไม่มีพื้นของตัวเอง (ชุดเดียวกับ .mode-group-label) */
    .best-label {
      display: inline-flex;
      align-items: center;
      padding: 0 0.3rem 0 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1;
      color: #e4e4e7;
      white-space: nowrap;
    }

    /* ทรง chip ของ HeroUI: พื้นทึบ ไม่มีขอบ มนเต็ม */
    .best-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1;
      color: #e4e4e7;
      white-space: nowrap;
    }

    .row-best-caption strong {
      color: #e9ecef;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(var(--card-min), var(--card-max)));
      gap: var(--card-gap);
      align-items: stretch;
      justify-content: center;
      --equipment-card-min-height: 212px;
    }

    .card {
      --frame: #6b7280;
      --glow: rgba(255, 255, 255, 0.15);
      position: relative;
      background: var(--card);
      border-radius: 14px;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      height: 100%;
    }

    .card-body { padding: 8px; }

    /*
     * eternal เป็นเกรดสูงสุด — ให้เด่นกว่าเกรดอื่นด้วยไล่สีที่ name-bar
     */
    .card.eternal .name-bar {
      /* แถบสว่างกลาง เข้มหัวท้าย — ทรงเดียวกับป้าย Eternal ในเกม */
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--frame) 90%, #7e22ce) 0%,
        color-mix(in srgb, var(--glow) 80%, var(--frame)) 42%,
        color-mix(in srgb, var(--glow) 64%, var(--frame)) 60%,
        color-mix(in srgb, var(--frame) 94%, #7e22ce) 100%
      );
    }


    .name-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--glow) 55%, var(--frame)) 0%,
        var(--frame) 100%
      );
      border-radius: 0;
      padding: 8px 8px 6px;
      box-sizing: border-box;
      text-align: left;
      font-size: 0.87rem;
      font-weight: 700;
      line-height: 1.15;
      color: #0f1114;
      text-shadow: 0 1px 0 color-mix(in srgb, var(--glow) 40%, transparent);
    }

    .name-bar-icon-wrap {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
    }

    /* เลเวลเป็นป้ายเล็กกึ่งกลางล่างไอคอน — ขอบล่างเป็นบริเวณที่ทับงานศิลป์น้อยสุด */
    .level-badge {
      position: absolute;
      left: 50%;
      bottom: 3px;
      transform: translateX(-50%);
      padding: 0.04rem 0.36rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      font-size: 0.52rem;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .name-bar-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }

    .name-bar-text-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.15rem;
      min-height: calc(1.15em * 2);
    }

    .name-bar-text {
      width: 100%;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .card.eternal .name-bar {
      color: #1e1b4b;
    }

    .card.legendary .name-bar {
      color: #422006;
    }

    /* base stat ชิดซ้าย / power ชิดขวา — ทรงและสีเหมือนกัน ต่างแค่ฝั่ง */
    .stat-primary-block {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.4rem;
      /* NOTE: padding ขวาต้องเท่า .stats li ไม่งั้น Power หลุดแนวตัวเลข substat */
      padding: 0.15rem 0.4rem 0.6rem;
    }

    .primary-cell {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      min-width: 0;
      align-items: flex-start;
    }

    .primary-cell.is-power {
      align-items: flex-end;
    }

    .stat-primary-block .label {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      font-size: 0.68rem;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .stat-primary-block .value {
      color: #fff;
      font-weight: 700;
      font-size: 0.86rem;
      line-height: 1.15;
      white-space: nowrap;
    }

    .stats {
      list-style: none;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.15);
    }

    .stats li {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 0.5rem;
      min-height: 2.25rem;
      padding: 0.1rem 0.45rem;
      font-size: 0.79rem;
    }

    .stats li .label,
    .stats li .value {
      line-height: 1.15;
      align-self: center;
    }


    /*
     * เครื่องหมายคุณภาพโรลต่อท้ายตัวเลข substat
     * ขึ้น: ฟ้า = top 25%, ฟ้าเขียว = top 10%, ดาวเหลือง = top 5%
     * ลง: ส้ม = bottom 25%, ส้มแดง = bottom 10%
     *
     * NOTE: ใช้ drop-shadow ไม่ใช่ box-shadow — box-shadow เรืองเป็นกรอบสี่เหลี่ยม
     * รอบไอคอน ไม่ใช่รอบตัวรูป
     *
     * NOTE: อยู่ในสายตัวอักษรหน้าตัวเลข — แถวที่มีเครื่องหมายตัวเลขจะถอยซ้ายตาม
     * ความกว้างไอคอน ไม่ได้ชิดขวาตรงแนวเดียวกับแถวที่ไม่มี
     */
    .roll-mark {
      width: 0.88em;
      height: 0.88em;
      margin-right: 0.2em;
      /*
       * NOTE: กลางไอคอนต้องตรงกลาง "ตัวเลข" ไม่ใช่กลางบรรทัด — ตัวเลขไม่มีหางล่าง
       * สูงแค่ ~0.72em ของ font ส่วนบรรทัดสูง 1.15em ถ้าจัดกลางบรรทัดไอคอนจะดูต่ำ
       * ค่าที่ได้ = (ความสูงตัวเลข - ความสูงไอคอน) / 2
       */
      vertical-align: -0.079em;
    }
    .roll-mark.is-top25 {
      color: #4dabf7;
      filter: drop-shadow(0 0 3px rgba(77, 171, 247, 0.85));
    }
    .roll-mark.is-top10 {
      color: #2dd4bf;
      filter: drop-shadow(0 0 3px rgba(45, 212, 191, 0.85));
    }
    .roll-mark.is-top5 {
      width: 0.58em;
      height: 0.58em;
      /*
       * NOTE: ดาวต้องยกสูงกว่าสูตรอีกนิด — วัดน้ำหนักหมึกแล้วจุดถ่วงอยู่ใต้กลางกรอบ
       * 3.9% เพราะปลายบนเรียวแต่ลำตัวล่างอ้วน จัดกลางตามกรอบเฉยๆ ตาจะเห็นว่าห้อยต่ำ
       */
      vertical-align: 0.094em;
      color: #fcc419;
      filter: drop-shadow(0 0 4px rgba(252, 196, 25, 0.9));
    }
    .roll-mark.is-bot25 {
      color: #ff922b;
      filter: drop-shadow(0 0 3px rgba(255, 146, 43, 0.8));
    }
    .roll-mark.is-bot10 {
      color: #f4512c;
      filter: drop-shadow(0 0 3px rgba(244, 81, 44, 0.8));
    }

    /*
     * แถวที่ไม่ใช่ best stat: เครื่องหมายจางลงและตัดแสงทิ้ง — โรลดีแค่ไหนก็ไม่ใช่ของ
     * ที่ตามหา จึงไม่ควรดึงสายตาไปก่อนแถวที่ใช่
     */
    .stats li:not(.stat-row-best) .roll-mark {
      opacity: 0.35;
      filter: none;
    }

    /* ช่วงค่าที่เป็นไปได้ของ substat — เล็กและจาง อยู่ใต้ตัวเลขฝั่งขวา */
    .stat-range {
      display: block;
      margin-top: 0.1rem;
      font-size: 0.56rem;
      font-weight: 400;
      line-height: 1.1;
      text-align: right;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .stat-row-best .stat-range {
      color: rgba(255, 255, 255, 0.4);
    }

    .stats .label {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      /* เล็กกว่าตัวเลขนิดนึง — ชื่อเป็นข้อมูลรอง ค่าเป็นตัวหลัก */
      font-size: 0.72rem;
      justify-self: start;
    }

    .stats .value {
      color: rgba(255, 255, 255, 0.65);
      font-weight: 600;
      text-align: right;
      justify-self: end;
    }

    .card.eternal .stat-row-best .label,
    .card.eternal .stat-row-best .value {
      /* NOTE: ผูกกับ --glow ของการ์ด — แก้สีเกรดใน constants.mjs แล้วตรงนี้ตามเอง */
      color: var(--glow);
      font-weight: 600;
    }

    .card.legendary .stat-row-best .label,
    .card.legendary .stat-row-best .value {
      color: #fdba74;
      font-weight: 600;
    }

    /* ── แท็บ Compare ─────────────────────────────────────────── */
    .section.compare {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 1.5rem;
    }

    /* NOTE: section เป็น flex — หัวข้อต้องกินเต็มบรรทัด ไม่งั้นไปเบียดอยู่ข้างกล่องแรก */
    .section.compare .section-header {
      width: 100%;
    }

    .compare-group {
      /* กว้างเท่าการ์ด 2 ใบ ไม่ใช่ 3 เหมือนแถวปกติ */
      max-width: calc(var(--card-max) * 2 + var(--card-gap));
    }

    /* หัวกล่องมีแค่ชื่อ slot ไม่มี tag ต่อท้าย เลยไม่ต้องมีแถบรอง */
    .compare-group .row-best-caption {
      margin-bottom: 0.45rem;
      padding: 0;
      min-height: 0;
      background: none;
    }

    .compare-group .best-label {
      align-self: flex-start;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.875rem;
    }

    /*
     * NOTE: แถวคำกำกับกับแถวการ์ดเป็นแถวของ .compare-grid ไม่ใช่ของแต่ละช่อง
     * (subgrid) — ป้าย best stat ของสอง set ยาวไม่เท่ากันได้ แต่การ์ดยังเริ่ม
     * ที่ความสูงเดียวกันเสมอ
     */
    .compare-grid {
      grid-template-columns: repeat(2, minmax(var(--card-min), var(--card-max)));
      grid-template-rows: auto auto;
      row-gap: 0.35rem;
      column-gap: var(--card-gap);
    }

    .compare-cell {
      display: grid;
      grid-row: span 2;
      grid-template-rows: subgrid;
      min-width: 0;
    }

    .compare-set {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: end;
      gap: 0.25rem;
      padding-left: 0.2rem;
    }

    /* กินเต็มบรรทัดในกล่อง flex ที่ wrap ได้ — tag เลยถูกดันลงบรรทัดถัดไปทั้งหมด */
    .compare-set-name {
      width: 100%;
      margin-bottom: 0.15rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.5);
    }

    .edit-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
    }

    /* การ์ดกว้างแค่ 175px — tag ต้องเล็กกว่าบนหัวแถบปกติ ไม่งั้นตกบรรทัดยาวเป็นพรืด */
    .compare-set .best-tag,
    .edit-tags .best-tag {
      padding: 0.15rem 0.4rem;
      font-size: 0.62rem;
    }

    .grid-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      min-height: 0;
      height: 100%;
      border-radius: 14px;
      border: 2px dashed rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.12);
    }

    .grid:not(:has(.card)) .grid-empty {
      min-height: var(--equipment-card-min-height);
    }

    .grid-empty-plate {
      width: 72px;
      height: 72px;
      object-fit: contain;
      opacity: 0.22;
      pointer-events: none;
      user-select: none;
    }

    .summary-hover {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .summary-float {
      position: fixed;
      left: 1rem;
      right: auto;
      bottom: var(--dock-bottom);
      z-index: 1002;
    }

    .summary-popover {
      position: absolute;
      left: 0;
      right: auto;
      bottom: calc(100% + 0.55rem);
      top: auto;
      z-index: 100;
      width: max-content;
      min-width: 11rem;
      max-width: min(16rem, calc(100vw - 2rem));
      padding: 0;
      background: rgba(22, 24, 28, 0.72);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition:
        opacity 0.16s ease,
